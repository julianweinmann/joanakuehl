<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seite nicht gefunden – Joana Kühl</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #FAF9F7; color: #5C5C5C; }
        h1, h2, h3 { font-family: 'Montserrat', sans-serif; }
        .bg-accent-orange { background-color: #F29979; }
        .hover\:bg-accent-orange-dark:hover { background-color: #e68a68; }
        .text-accent-orange { color: #F29979; }
        .shadow-soft { box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05); }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen px-6">
    <div class="text-center max-w-md">
        <h1 class="text-6xl font-semibold text-accent-orange mb-4" style="font-family: 'Montserrat', sans-serif;">404</h1>
        <h2 class="text-2xl font-medium mb-4" style="color: #4a4a4a; font-family: 'Montserrat', sans-serif;">Seite nicht gefunden</h2>
        <p class="text-gray-500 mb-8 leading-relaxed">
            Die Seite, die Du suchst, existiert leider nicht mehr oder wurde verschoben.
            Kein Problem – lass uns gemeinsam den richtigen Weg finden.
        </p>
        <a href="/" class="inline-block bg-accent-orange text-white font-semibold py-3 px-8 rounded-full shadow-soft hover:bg-accent-orange-dark transition-colors duration-300">
            Zur Startseite
        </a>
    </div>
</body>
</html>
